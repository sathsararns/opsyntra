# Official action revisions are pinned; see docs/CI.md for update/reproduction.
name: Opsyntra CI
'on':
  push: {}
  pull_request: {}
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  PYTHONUNBUFFERED: '1'
  PYTHONHASHSEED: '0'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  MLFLOW_DISABLE_AGENT_HINT: '1'
  NEXT_TELEMETRY_DISABLED: '1'
jobs:
  backend:
    name: Backend synthetic checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: backend/requirements/*linux.lock
    - name: Install hash-locked CPU dependencies
      run: python -m pip install --require-hashes -r backend/requirements/ci-py312-linux.lock
    - name: Run strict self-contained profile
      run: python -m pipelines.ci_checks --profile core
      working-directory: backend
    - name: Upload results even on failure
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: backend-results
        path: backend/artifacts/ci/reports/
        retention-days: 14
        if-no-files-found: error
  frontend:
    name: Frontend build and synthetic browser flows
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: backend/requirements/*linux.lock
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: frontend/package-lock.json
    - name: Install hash-locked CPU dependencies
      run: python -m pip install --require-hashes -r backend/requirements/ci-py312-linux.lock
    - name: Build isolated synthetic fixture
      run: python -m pipelines.ci_prepare --directory artifacts/ci/fixture
      working-directory: backend
    - name: Install locked frontend dependencies
      run: npm ci
      working-directory: frontend
    - name: Generate Next route types
      run: npx next typegen
      working-directory: frontend
    - name: Typecheck
      run: npm run typecheck
      working-directory: frontend
    - name: Production build
      run: npm run build
      working-directory: frontend
    - name: Install Chromium
      run: npx playwright install --with-deps chromium
      working-directory: frontend
    - name: Run fixture browser tests
      run: npx playwright test --config playwright.ci.config.ts
      working-directory: frontend
    - name: Upload results even on failure
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: frontend-results
        path: 'frontend/test-results/

          frontend/playwright-report/

          backend/artifacts/ci/fixture/ci_fixture.json'
        retention-days: 14
        if-no-files-found: error
  postgres-kafka:
    name: PostgreSQL and Kafka recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: ci-local-only
        ports:
        - 5432:5432
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 12
      kafka:
        image: apache/kafka:4.3.1
        ports:
        - 9092:9092
        options: --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092" --health-interval
          10s --health-timeout 10s --health-retries 12
        env:
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: '0'
    env:
      OPSYNTRA_CI_POSTGRES_ADMIN_URL: postgresql://postgres:ci-local-only@127.0.0.1:5432/postgres
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: backend/requirements/*linux.lock
    - name: Install hash-locked CPU dependencies
      run: python -m pip install --require-hashes -r backend/requirements/ci-py312-linux.lock
    - name: Provision isolated databases and least-privilege roles
      run: python -m pipelines.ci_database
      working-directory: backend
    - name: Run real database/API tests; no skips
      run: python -m pipelines.ci_checks --profile postgres
      working-directory: backend
    - name: Real Kafka commit/crash/replay checks
      run: python -m pipelines.ci_kafka
      working-directory: backend
    - name: Upload results even on failure
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: integration-results
        path: backend/artifacts/ci/reports/
        retention-days: 14
        if-no-files-found: error
