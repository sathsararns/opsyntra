name: Opsyntra native Spark
'on':
  workflow_dispatch: {}
  schedule:
  - cron: 17 2 * * 1
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  PYTHONUNBUFFERED: '1'
  PYTHONHASHSEED: '0'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  MLFLOW_DISABLE_AGENT_HINT: '1'
  NEXT_TELEMETRY_DISABLED: '1'
jobs:
  spark:
    name: Native Spark synthetic checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SPARK_LOCAL_IP: 127.0.0.1
      PYSPARK_PYTHON: python
      PYSPARK_DRIVER_PYTHON: python
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: backend/requirements/*linux.lock
    - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
      with:
        distribution: temurin
        java-version: '21'
    - name: Install locked CPU Spark environment
      run: python -m pip install --require-hashes -r backend/requirements/ci-spark-py312-linux.lock
    - name: Run all native tests without production artifacts or skips
      run: python -m pipelines.ci_checks --profile spark
      working-directory: backend
    - name: Upload reports even on failure
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: spark-results
        path: backend/artifacts/ci/reports/
        retention-days: 14
        if-no-files-found: error
