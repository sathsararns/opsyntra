[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opsyntra"
version = "0.1.0"
description = "Telco customer churn data, ML and streaming pipelines"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2,<4",
  "numpy>=1.26,<3",
  "scikit-learn>=1.4,<2",
  "PyYAML>=6,<7",
  "joblib>=1.4,<2",
  "xgboost>=2.1,<4",
]

[tool.setuptools.packages.find]
where = ["src"]
