[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opsyntra"
version = "0.1.0"
description = "Telco customer churn data, ML and streaming pipelines"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2,<4",
  "numpy>=1.26,<3",
  "scikit-learn>=1.6,<2",
  "PyYAML>=6,<7",
  "joblib>=1.4,<2",
  "xgboost>=2.1,<4",
  "mlflow>=3.17,<4",
  "matplotlib>=3.9,<4",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
spark = ["pyspark==4.0.2", "pyarrow>=15,<26"]
web = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1"]

kafka = ["confluent-kafka==2.16.0"]
analytics = ["psycopg[binary]>=3.3,<4", "python-dotenv>=1,<2"]
