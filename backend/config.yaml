project_name: Opsyntra
data:
  raw_path: data/raw/WA_Fn-UseC_-Telco-Customer-Churn.csv
  archive_member: WA_Fn-UseC_-Telco-Customer-Churn.csv
  normalized_path: data/processed/telco_customers.csv
  identifier: customerID
  target: Churn
preprocessing:
  # Step 1 converts blanks to numeric missing values and retains every row.
  # The model pipeline fits median imputation inside each training/CV fold.
  total_charges_missing_policy: preserve_for_training_imputer
splitting:
  seed: 42
  train: 0.60
  validation: 0.20
  test: 0.20
  output_dir: data/splits
report_path: reports/data_validation_report.json
training:
  models: [dummy, logistic_regression, random_forest, xgboost]
  seed: 42
  cv_folds: 3
  selection_metric: average_precision
  # Keep CV sequential and bound estimator threads for predictable local use.
  estimator_jobs: 2
  artifact_dir: artifacts/models
  report_path: reports/model_training_report.json
  comparison_path: reports/model_comparison.csv
  # Model ranking: validation AP. Operating threshold: maximum validation F1.
  tracking:
    database: mlflow.db
    artifact_dir: mlartifacts
    experiment_name: Opsyntra-Telco-sklearn
  param_grids:
    dummy: {}
    logistic_regression:
      classifier__C: [0.1, 1.0, 10.0]
    random_forest:
      classifier__max_depth: [8, null]
      classifier__min_samples_leaf: [2, 5]
    xgboost:
      classifier__max_depth: [3, 5]
      classifier__learning_rate: [0.05, 0.1]

spark:
  master: local[2]
  shuffle_partitions: 2
  seed: 42
  cv_folds: 3
  inference_repeats: 3
  artifact_dir: artifacts/spark
  report_path: reports/spark_training_report.json
  comparison_path: reports/engine_comparison.json
  experiment_name: Opsyntra-Telco-Spark
  # Small training-only searches; Spark and sklearn parameters are not identical.
  models:
    logistic_regression:
      parameters: {maxIter: 100, elasticNetParam: 0.0, standardization: false}
      grid: {regParam: [0.0, 0.01]}
    random_forest:
      parameters: {numTrees: 200, minInstancesPerNode: 5, featureSubsetStrategy: sqrt}
      grid: {maxDepth: [5, 8]}
    xgboost:
      parameters: {n_estimators: 200, learning_rate: 0.05, tree_method: hist, num_workers: 1, verbose: false, verbosity: 0}
      grid: {max_depth: [3, 5]}

orchestration:
  dag_id: opsyntra_ml_workflow
  artifact_dir: artifacts/airflow
  prediction_input: examples/customers.csv
  # Approval uses validation data and artifact integrity, never test scores.
  minimum_validation_average_precision: 0.0
  require_improvement_over_dummy: true
  retries: 2
  retry_delay_seconds: 20
  task_timeout_minutes: 30
  dag_timeout_minutes: 120
